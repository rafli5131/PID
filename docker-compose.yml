version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: air_quality_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: air_quality_monitoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - monitoring_net

  weather_scraper:
    build:
      context: .
      dockerfile: docker/weather_scraper/Dockerfile
    container_name: weather_scraper
    environment:
      DB_HOST: postgres
      DB_NAME: air_quality_monitoring
      DB_USER: admin
      DB_PASSWORD: adminpassword
    depends_on:
      - postgres
    networks:
      - monitoring_net

  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit/Dockerfile
    container_name: streamlit_dashboard
    environment:
      DB_HOST: postgres
      DB_NAME: air_quality_monitoring
      DB_USER: admin
      DB_PASSWORD: adminpassword
    ports:
      - "8501:8501"
    depends_on:
      - postgres
    networks:
      - monitoring_net

networks:
  monitoring_net:
    driver: bridge

volumes:
  postgres_data:
