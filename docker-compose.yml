version: '3.8'

services:
  postgres:
    image: bitnami/postgresql
    container_name: air_quality_db
    environment:
      TZ: Asia/Jakarta
      POSTGRESQL_TIMEZONE: Asia/Jakarta
      POSTGRESQL_USERNAME: admin
      POSTGRESQL_PASSWORD: adminpassword
      POSTGRESQL_DATABASE: air_quality_monitoring
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/bitnami/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - monitoring_net

  weather_scraper:
    build:
      context: .
      dockerfile: docker/weather_scraper/Dockerfile
    container_name: weather_scraper
    environment:
      TZ: Asia/Jakarta
      DB_HOST: postgres
      DB_NAME: air_quality_monitoring
      DB_USER: admin
      DB_PASSWORD: adminpassword
    depends_on:
      - postgres
    networks:
      - monitoring_net

  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit/Dockerfile
    container_name: streamlit_dashboard
    environment:
      TZ: Asia/Jakarta
      DB_HOST: postgres
      DB_NAME: air_quality_monitoring
      DB_USER: admin
      DB_PASSWORD: adminpassword
    ports:
      - "8501:8501"
    depends_on:
      - postgres
    networks:
      - monitoring_net

networks:
  monitoring_net:
    driver: bridge

volumes:
  pg_data:
